name: Typing

on:
  push:
  pull_request:

jobs:
  mypy:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r dev-requirements.txt
      - name: Run mypy
        run: mypy
